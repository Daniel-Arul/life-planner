services:
  app:
    build: .
    image: life-planner:latest
    restart: unless-stopped
    # Rootless Docker: container root is your own user on the host, so it can
    # write ./data without chown. (The image's uid-1000 user maps to a subuid.)
    user: "0:0"
    env_file: .env
    ports:
      # Loopback only: reachable through `tailscale serve`, not from the LAN.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
